<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription en ligne - USSEIN MI</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --accent-color: #e74c3c;
            --light-color: #ecf0f1;
            --dark-color: #2c3e50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin: 20px 0 30px;
            padding: 15px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header h3 {
            font-size: 1.8rem;
            animation: slide 3s infinite alternate;
        }

        @keyframes slide {
            from { transform: translateX(-10px); }
            to { transform: translateX(10px); }
        }

        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        h1 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        .form-table {
            width: 100%;
            border-collapse: collapse;
        }

        .form-table tr:not(:last-child) {
            margin-bottom: 15px;
            display: block;
        }

        .form-table td {
            padding: 10px 0;
            display: block;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: var(--secondary-color);
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            transition: border 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            border-color: var(--secondary-color);
            outline: none;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.5);
        }

        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .required::after {
            content: " *";
            color: var(--accent-color);
        }

        .button-group {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        input[type="submit"],
        input[type="reset"] {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.3s;
        }

        input[type="submit"] {
            background-color: var(--secondary-color);
            color: white;
        }

        input[type="submit"]:hover {
            background-color: #2980b9;
        }

        input[type="reset"] {
            background-color: #95a5a6;
            color: white;
        }

        input[type="reset"]:hover {
            background-color: #7f8c8d;
        }

        .mandatory-note {
            text-align: center;
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--dark-color);
        }

        .mandatory-note span {
            color: var(--accent-color);
        }

        @media (max-width: 600px) {
            .form-container {
                padding: 20px;
            }
            
            .header h3 {
                font-size: 1.4rem;
            }
            
            h1 {
                font-size: 1.5rem;
            }
        }

        .ans-label {
            color: var(--secondary-color);
        }
    </style>
    <script language="javascript">
        function verification() {
            const requiredFields = ['INE', 'pnom', 'nom', 'age', 'genre', 'campus', 'specialite'];
            let isValid = true;

            requiredFields.forEach(field => {
                const element = document.getElementById(field);
                if (!element.value) {
                    element.style.borderColor = 'red';
                    isValid = false;
                } else {
                    element.style.borderColor = '';
                }
            });

            if (!isValid) {
                alert('Veuillez remplir tous les champs obligatoires marqués d\'un astérisque (*)');
                return false;
            }
            return true;
        }

        function chiffres(event) {
            if (!event && window.event) {
                event = window.event;
            }
            if ((event.which < 48 || event.which > 57) && event.keyCode != 8 && event.keyCode != 9) {
                event.preventDefault();
            }
        }

        // Ajout pour améliorer l'UX
        document.addEventListener('DOMContentLoaded', function() {
            const requiredFields = document.querySelectorAll('[required], .required');
            requiredFields.forEach(field => {
                field.addEventListener('input', function() {
                    if (this.value) {
                        this.style.borderColor = '';
                    }
                });
            });
        });
    </script>
</head>
<body>
    <div class="header">
        <h3>Inscription USSEIN MI</h3>
    </div>

    <div class="form-container">
        <form method="POST" action="Affichage.php" onsubmit="return verification();">
            <h1>Enregistrement</h1>
            
            <table class="form-table">
                <tr>
                    <td>
                        <label for="INE" class="required">INE</label>
                        <input type="number" name="NumINE" id="INE" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="pnom" class="required">Prénom</label>
                        <input type="text" name="Prenom" id="pnom" required>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="nom" class="required">Nom</label>
                        <input type="text" name="Nom" id="nom" required>
                    </td>
                </tr>
                        <span class="ans-label">ans</span>
                    <td>
                        <label for="age" class="required">Âge</label>
                        <input type="number" name="Age" id="age" onkeypress="chiffres(event)" maxlength="2" required>
                        <span class="ans-label">ans</span>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label class="required">Genre</label>
                        <div class="radio-group">
                            <div class="radio-option">
                                <input type="radio" name="Genre" id="genreH" value="H" required title="Homme">
                                <label for="genreH">Homme</label>
                            </div>
                            <div class="radio-option">
                                <input type="radio" name="Genre" id="genreF" value="F" title="Femme">
                                <label for="genreF">Femme</label>
                            </div>
                        </div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="campus" class="required">Campus</label>
                        <select name="Campus" id="campus" required>
                            <option value="">Sélectionnez un campus</option>
                            <option value="Kaolack">Kaolack</option>
                            <option value="Khelcom">Khelcom</option>
                            <option value="Fatick">Fatick</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>
                        <label for="specialite" class="required">Spécialité</label>
                        <select name="Specialite" id="specialite" required>
                            <option value="">Sélectionnez une spécialité</option>
                            <option value="Mathématique">Mathématique</option>
                            <option value="Informatique">Informatique</option>
                            <option value="Agrotic">Agrotic</option>
                        </select>
                    </td>
                </tr>
            </table>

            <div class="button-group">
                <input type="submit" name="Valider" value="S'inscrire">
                <input type="reset" name="an" value="Annuler">
            </div>

            <p class="mandatory-note"><span>*</span> Champs obligatoires</p>
        </form>
    </div>
</body>
</html>
